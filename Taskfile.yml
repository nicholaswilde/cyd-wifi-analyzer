---
version: '3'

dotenv: ['.env']

vars:
  PIO_ENV: '{{.PIO_ENV | default "cyd_28r"}}'

tasks:
  init:
    desc: Initialize project environment file
    status:
      - test -f .env
    preconditions:
      - test -f .env.example
    cmds:
      - cp .env.example .env

  coverage:report:
    desc: Show coverage report
    cmds:
      - task: test
        ignore_error: true
      - lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info --rc branch_coverage=1 --ignore-errors "gcov,source"
      - lcov --remove lcov_raw.info '*/.pio/*' '*/tests/*' '*/tests/mocks/*' '/usr/*' -o lcov.info --rc branch_coverage=1 --ignore-errors "unused,source"
      - lcov --list lcov.info
      - defer: rm -f lcov_raw.info lcov.info

  coverage:upload:
    desc: Generate and upload coverage report to Coveralls.io
    dotenv: ['.env']
    preconditions:
      - sh: 'test -n "$COVERALLS_REPO_TOKEN"'
        msg: "COVERALLS_REPO_TOKEN is not set. Please add it to your .env file."
    cmds:
      # 1. Run native tests to output coverage data
      - task: test
        ignore_error: true
      # 2. Extract and capture raw code coverage reports
      - lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info --rc branch_coverage=1 --ignore-errors "gcov,source"
      # 3. Clean up the report by filtering out system and test files
      - lcov --remove lcov_raw.info '*/.pio/*' '*/tests/*' '*/tests/mocks/*' '/usr/*' -o lcov.info --rc branch_coverage=1 --ignore-errors "unused,source"
      # 4. Upload to coveralls using the CLI binary
      - coveralls report lcov.info -n -r $COVERALLS_REPO_TOKEN
      # 5. Clean up temporary local files
      - defer: rm -f lcov_raw.info lcov.info

  build:
    desc: Build firmware for default environment ({{.PIO_ENV}})
    cmds:
      - pio run -e {{.PIO_ENV}}

  build:cyd_28r:
    desc: Build firmware for 2.8" Resistive Touch CYD (ILI9341 / XPT2046)
    cmds:
      - pio run -e cyd_28r

  build:cyd_28r_inv:
    desc: Build firmware for 2.8" Resistive Touch CYD (Inverted)
    cmds:
      - pio run -e cyd_28r_inv

  build:cyd_28c:
    desc: Build firmware for 2.8" Capacitive Touch CYD (JC2432W328C)
    cmds:
      - pio run -e cyd_28c

  build:cyd_28c_inv:
    desc: Build firmware for 2.8" Capacitive Touch CYD (Inverted)
    cmds:
      - pio run -e cyd_28c_inv

  build:cyd_28_nm:
    desc: Build firmware for 2.8" Resistive Touch CYD NodeMiner (ST7789 / XPT2046)
    cmds:
      - pio run -e cyd_28_nm

  build:cyd_28_nm_inv:
    desc: Build firmware for 2.8" Resistive Touch CYD NodeMiner Inverted (ST7789 / XPT2046)
    cmds:
      - pio run -e cyd_28_nm_inv

  build:cyd_35c:
    desc: Build firmware for 3.5" Capacitive Touch CYD (ESP32-3248S035C)
    cmds:
      - pio run -e cyd_35c

  build:cyd_35c_inv:
    desc: Build firmware for 3.5" Capacitive Touch CYD (Inverted)
    cmds:
      - pio run -e cyd_35c_inv

  upload:
    desc: Upload firmware for default environment
    cmds:
      - pio run -e {{.PIO_ENV}} --target upload

  upload:cyd_28r:
    desc: Upload firmware for cyd_28r
    cmds:
      - pio run -e cyd_28r --target upload

  upload:cyd_28r_inv:
    desc: Upload firmware for cyd_28r_inv
    cmds:
      - pio run -e cyd_28r_inv --target upload

  upload:cyd_28c:
    desc: Upload firmware for cyd_28c
    cmds:
      - pio run -e cyd_28c --target upload

  upload:cyd_28c_inv:
    desc: Upload firmware for cyd_28c_inv
    cmds:
      - pio run -e cyd_28c_inv --target upload

  upload:cyd_28_nm:
    desc: Upload firmware for cyd_28_nm
    cmds:
      - pio run -e cyd_28_nm --target upload

  upload:cyd_28_nm_inv:
    desc: Upload firmware for cyd_28_nm_inv
    cmds:
      - pio run -e cyd_28_nm_inv --target upload

  upload:cyd_35c:
    desc: Upload firmware for cyd_35c
    cmds:
      - pio run -e cyd_35c --target upload

  upload:cyd_35c_inv:
    desc: Upload firmware for cyd_35c_inv
    cmds:
      - pio run -e cyd_35c_inv --target upload

  eau:
    desc: Erase flash and upload firmware
    cmds:
      - pio run -e {{.PIO_ENV}} -t erase -t upload

  eau:cyd_28r:
    desc: Erase flash and upload for cyd_28r
    cmds:
      - pio run -e cyd_28r -t erase -t upload

  eau:cyd_28_nm:
    desc: Erase flash and upload for cyd_28_nm
    cmds:
      - pio run -e cyd_28_nm -t erase -t upload

  eau:cyd_35c:
    desc: Erase flash and upload for cyd_35c
    cmds:
      - pio run -e cyd_35c -t erase -t upload

  uam:
    desc: Upload firmware and start serial monitor
    cmds:
      - pio run -e {{.PIO_ENV}} -t upload -t monitor

  uam:cyd_28r:
    desc: Upload and monitor for cyd_28r
    cmds:
      - pio run -e cyd_28r -t upload -t monitor

  uam:cyd_28_nm:
    desc: Upload and monitor for cyd_28_nm
    cmds:
      - pio run -e cyd_28_nm -t upload -t monitor

  uam:cyd_35c:
    desc: Upload and monitor for cyd_35c
    cmds:
      - pio run -e cyd_35c -t upload -t monitor

  monitor:
    desc: Start serial monitor
    cmds:
      - pio device monitor

  screenshot:
    desc: Capture screenshot from connected CYD board over USB serial
    cmds:
      - uv run --with pyserial --with pillow python scripts/capture-serial-screenshot.py {{.CLI_ARGS}}

  test:
    desc: Run host-native unit tests
    cmds:
      - pio test -e native

  check:
    desc: Run static code analysis
    cmds:
      - pio check -e {{.PIO_ENV}}

  check:cyd_28r:
    desc: Run static code analysis for cyd_28r
    cmds:
      - pio check -e cyd_28r

  check:cyd_28r_inv:
    desc: Run static code analysis for cyd_28r_inv
    cmds:
      - pio check -e cyd_28r_inv

  check:cyd_28c:
    desc: Run static code analysis for cyd_28c
    cmds:
      - pio check -e cyd_28c

  check:cyd_28c_inv:
    desc: Run static code analysis for cyd_28c_inv
    cmds:
      - pio check -e cyd_28c_inv

  check:cyd_28_nm:
    desc: Run static code analysis for cyd_28_nm
    cmds:
      - pio check -e cyd_28_nm

  check:cyd_28_nm_inv:
    desc: Run static code analysis for cyd_28_nm_inv
    cmds:
      - pio check -e cyd_28_nm_inv

  check:cyd_35c:
    desc: Run static code analysis for cyd_35c
    cmds:
      - pio check -e cyd_35c

  check:cyd_35c_inv:
    desc: Run static code analysis for cyd_35c_inv
    cmds:
      - pio check -e cyd_35c_inv

  clean:
    desc: Clean build outputs
    cmds:
      - pio run -t clean
