---
name: PlatformIO Test Build

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - '**.ini'
      - '.agents/design.md'
      - 'scripts/**'
      - 'Taskfile.yml'
      - '.github/workflows/test.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.h'
      - '**.ini'
      - '.agents/design.md'
      - 'scripts/**'
      - 'Taskfile.yml'
      - '.github/workflows/test.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-design:
    name: Lint Design System
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm and npx
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npx-designmd-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npx-designmd-
            ${{ runner.os }}-npm-

      - name: Validate DESIGN.md
        run: npx --prefer-offline @google/design.md lint .agents/design.md

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - cyd_28r
          - cyd_28r_inv
          - cyd_35c
          - cyd_35c_inv
          - cyd_28c
          - cyd_28c_inv
          - cyd_28_nm
          - cyd_28_nm_inv
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      # Install lcov utility
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO Core
        uses: actions/cache@v4
        with:
          path: ~/.platformio/packages
          key: ${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install go-task
      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Test PlatformIO Project
        run: pio check -e ${{ matrix.env }}

      - name: Build PlatformIO Project
        run: |
          task test || true
          pio run --environment ${{ matrix.env }}

      # Generate and clean the lcov.info report (with compatible LCOV 1.x flags)
      - name: Generate Coverage Report
        run: |
          lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info
          lcov --remove lcov_raw.info '*/.pio/*' '*/tests/*' '*/tests/mocks/*' '/usr/*' --ignore-errors unused -o lcov.info

      # Upload coverage report directly to Coveralls.io
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
